[project]
name = "fairvaluelab"
version = "0.1.0"
description = "Low-latency cross-venue fair-value research and execution system"
readme = "README.md"
authors = [
    { name = "midhilesh", email = "chintu.midhilesh@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=17.1",
]

[project.scripts]
fvl-capture = "fairvaluelab.capture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
