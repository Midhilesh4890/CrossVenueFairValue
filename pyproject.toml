[project]
name = "fairvaluelab"
version = "0.1.0"
description = "Latency-aware cross-venue fair-value research toolkit"
readme = "README.md"
authors = [
    { name = "midhilesh", email = "chintu.midhilesh@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "websockets>=17.1",
]

[project.scripts]
fvl-capture = "fairvaluelab.capture.cli:main"
fvl-data-quality = "fairvaluelab.data_quality:main"
fvl-research-dataset = "fairvaluelab.research_dataset:main"
fvl-cross-venue-study = "fairvaluelab.cross_venue_study:main"
fvl-lead-lag = "fairvaluelab.lead_lag:main"
fvl-reference-study = "fairvaluelab.reference_study:main"
fvl-ablation = "fairvaluelab.ablation:main"
fvl-staleness = "fairvaluelab.staleness:main"
fvl-latency = "fairvaluelab.latency:main"
fvl-benchmark-report = "fairvaluelab.benchmark_report:main"
fvl-latency-power = "fairvaluelab.latency_power:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
